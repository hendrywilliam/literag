apiVersion: v1
kind: Namespace
metadata:
  name: literag
---
apiVersion: v1
kind: Service
metadata:
  name: dozerdb
  namespace: literag
  labels:
    app: dozerdb
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 7474
      targetPort: 7474
      protocol: TCP
    - name: bolt
      port: 7687
      targetPort: 7687
      protocol: TCP
  selector:
    app: dozerdb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dozerdb
  namespace: literag
  labels:
    app: dozerdb
spec:
  serviceName: dozerdb
  replicas: 1
  selector:
    matchLabels:
      app: dozerdb
  template:
    metadata:
      labels:
        app: dozerdb
    spec:
      containers:
        - name: dozerdb
          image: graphstack/dozerdb:5.26.27.0
          ports:
            - name: http
              containerPort: 7474
              protocol: TCP
            - name: bolt
              containerPort: 7687
              protocol: TCP
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: dozerdb-auth
                  key: NEO4J_AUTH
            - name: NEO4J_PLUGINS
              value: '["apoc","open-gds"]'
            - name: NEO4J_apoc_export_file_enabled
              value: "true"
            - name: NEO4J_apoc_import_file_enabled
              value: "true"
            - name: NEO4J_dbms_security_procedures_unrestricted
              value: "*"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
            - name: import
              mountPath: /var/lib/neo4j/import
            - name: plugins
              mountPath: /plugins
      volumes:
        - name: logs
          emptyDir: {}
        - name: import
          emptyDir: {}
        - name: plugins
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dozerdb-headless
  namespace: literag
  labels:
    app: dozerdb
spec:
  clusterIP: None
  ports:
    - name: http
      port: 7474
      targetPort: 7474
      protocol: TCP
    - name: bolt
      port: 7687
      targetPort: 7687
      protocol: TCP
  selector:
    app: dozerdb
